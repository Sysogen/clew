[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters/inbound",
    "crates/adapters/outbound",
    "crates/bootstrap",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/sysogen/clew"

[workspace.dependencies]
clew-domain = { version = "0.1.0", path = "crates/domain" }
clew-application = { version = "0.1.0", path = "crates/application" }
clew-adapter-cli = { version = "0.1.0", path = "crates/adapters/inbound" }
clew-adapter-fs = { version = "0.1.0", path = "crates/adapters/outbound" }
globset = "0.4"
# Default_Ignorable_Code_Point from Unicode's own data. std has no such test,
# and a hand-kept table goes stale silently, missing characters.
icu_properties = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
thiserror = "2"
yaml-rust2 = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
