[package]
name = "clew-domain"
description = "Domain model for clew: agent surfaces, scan policy, and outbound ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# betterleaks' rules: a keyword gate, the patterns it lets through, then Expr
# filters, some measuring token efficiency.
aho-corasick.workspace = true
expr-lang.workspace = true
indexmap.workspace = true
regex.workspace = true
tiktoken-rs.workspace = true
# Compiles the catalogue's globs into one matcher, so matching a path against
# every row costs one pass rather than one comparison per row.
globset.workspace = true
# Parsers and data, not runtimes: no IO, no async, nothing the domain must not
# have.
icu_properties.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
toml.workspace = true
thiserror.workspace = true
yaml-rust2.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true

[lints]
workspace = true
