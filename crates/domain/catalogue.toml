# The surfaces clew recognises.
#
# Rows, not code. A tool renaming a path is a one-line change here, reviewable
# by anyone, with a citation and a date. Order matters: the first matching row
# wins, so a specific pattern must precede a general one.
#
# glob          matched against the repository-relative path, forward slashes
# tool          which tool owns it
# format        json, toml, or markdown. Omitted means json.
# extract       what to read out of it. Omitted means inventory only: the file
#               is reported and never opened, which matters when it may be a
#               compiled binary
# kind          what it is, for display and for rules
# last_verified when this row was last checked against primary documentation
# source        the documentation it was checked against

version = 1

# --- Claude Code ------------------------------------------------------------

[[surface]]
glob = "**/.claude/settings.json"
tool = "claude-code"
kind = "claude-code"
extract = ["hooks", "permissions", "mcp-servers"]
last_verified = "2026-09-11"
source = "https://code.claude.com/docs/en/settings"

[[surface]]
glob = "**/.claude/settings.local.json"
tool = "claude-code"
kind = "claude-code"
extract = ["hooks", "permissions", "mcp-servers"]
last_verified = "2026-09-11"
source = "https://code.claude.com/docs/en/settings"

[[surface]]
glob = "**/.mcp.json"
tool = "claude-code"
kind = "mcp-servers"
extract = ["mcp-servers"]
last_verified = "2026-09-11"
source = "https://code.claude.com/docs/en/mcp"

[[surface]]
glob = "**/.claude/**/hooks/**"
tool = "claude-code"
kind = "hook-script"
last_verified = "2026-09-11"
source = "https://code.claude.com/docs/en/hooks"

[[surface]]
glob = "**/.claude/skills/**/SKILL.md"
tool = "claude-code"
kind = "skill"
format = "markdown"
extract = ["permissions"]
last_verified = "2026-09-11"
source = "https://code.claude.com/docs/en/skills"

[[surface]]
glob = "**/CLAUDE.md"
tool = "claude-code"
kind = "instruction"
last_verified = "2026-09-11"
source = "https://code.claude.com/docs/en/memory"

# --- Kiro -------------------------------------------------------------------
#
# Ahead of Codex because Kiro keeps AGENTS.md inside its steering directory,
# and the first matching row wins.

[[surface]]
glob = "**/.kiro/settings/mcp.json"
tool = "kiro"
kind = "kiro"
extract = ["mcp-servers"]
last_verified = "2026-09-12"
source = "https://kiro.dev/docs/mcp/configuration/"

# Frontmatter inclusion = "always" puts the file in every interaction.
[[surface]]
glob = "**/.kiro/steering/**/*.md"
tool = "kiro"
kind = "kiro"
last_verified = "2026-09-12"
source = "https://kiro.dev/docs/steering/"

# Fires on an event with no prompt, running a shell command or injecting one.
[[surface]]
glob = "**/.kiro/hooks/**/*.json"
tool = "kiro"
kind = "kiro"
extract = ["hooks"]
last_verified = "2026-09-12"
source = "https://kiro.dev/docs/hooks/"

# --- Codex ------------------------------------------------------------------

[[surface]]
glob = "**/.codex/config.toml"
tool = "codex"
kind = "codex"
format = "toml"
extract = ["mcp-servers"]
last_verified = "2026-09-11"
source = "https://github.com/openai/codex/blob/main/docs/config.md"

[[surface]]
glob = "**/AGENTS.md"
tool = "codex"
kind = "instruction"
last_verified = "2026-09-11"
source = "https://agents.md"

# --- Gemini CLI -------------------------------------------------------------

# Project settings. The user-level file sits outside any repository.
[[surface]]
glob = "**/.gemini/settings.json"
tool = "gemini-cli"
kind = "gemini"
extract = ["mcp-servers"]
last_verified = "2026-09-12"
source = "https://github.com/google-gemini/gemini-cli/blob/main/docs/reference/configuration.md"

# --- Cursor -----------------------------------------------------------------

[[surface]]
glob = "**/.cursor/mcp.json"
tool = "cursor"
kind = "cursor"
extract = ["mcp-servers"]
last_verified = "2026-09-12"
source = "https://cursor.com/docs/mcp"

[[surface]]
glob = "**/.cursor/rules/**/*.mdc"
tool = "cursor"
kind = "cursor"
last_verified = "2026-09-11"
source = "https://cursor.com/docs/rules"

# Legacy, and Cursor says it will be deprecated, but it is still read until
# the file is deleted, so a repository that never migrated still has one.
[[surface]]
glob = "**/.cursorrules"
tool = "cursor"
kind = "cursor"
last_verified = "2026-09-12"
source = "https://cursor.com/help/customization/rules"

# --- VS Code and Copilot ----------------------------------------------------

# A task may set runOn = "folderOpen", which runs it when the folder opens.
[[surface]]
glob = "**/.vscode/tasks.json"
tool = "vscode"
kind = "vscode"
last_verified = "2026-09-12"
source = "https://code.visualstudio.com/docs/debugtest/tasks"

[[surface]]
glob = "**/.vscode/mcp.json"
tool = "vscode"
kind = "vscode"
last_verified = "2026-09-12"
source = "https://code.visualstudio.com/docs/agent-customization/mcp-servers"
# extract: the server key here is not `mcpServers`; shape unverified

[[surface]]
glob = "**/.github/copilot-instructions.md"
tool = "copilot"
kind = "copilot"
last_verified = "2026-09-12"
source = "https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions"

