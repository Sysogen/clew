# --- Codex ------------------------------------------------------------------

# Codex loads lifecycle hooks from `hooks.json` beside a config layer or from
# an inline `[hooks]` table here, and both parse to one shape. `features.hooks`
# can switch them off, and a hook needs persisted trust before it runs; a hook
# behind either is still reported, being one edit or one approval from running,
# which is how a hook with `enabled: false` is already treated.
[[surface]]
glob = "**/.codex/config.toml"
tool = "codex"
kind = "codex"
format = "toml"
extract = ["mcp-servers", "autonomy", "hooks"]
check = ["bypass-permissions", "plaintext-transport"]
last_verified = "2026-10-11"
source = "https://developers.openai.com/codex/config-reference"

[[surface]]
glob = "**/.codex/hooks.json"
tool = "codex"
kind = "codex"
extract = ["hooks"]
last_verified = "2026-10-11"
source = "https://developers.openai.com/codex/hooks"

# The directory the documented hooks run from. A script here is read even when
# no hook names it yet, as `.claude/**/hooks/**` is.
[[surface]]
glob = "**/.codex/hooks/**"
tool = "codex"
kind = "hook-script"
check = [
  "invisible-unicode",
  "opaque-hook",
  "download-and-execute",
  "decode-and-execute",
  "credential-exfiltration",
  "unverified-download",
  "unpinned-remote-package",
]
last_verified = "2026-10-11"
source = "https://developers.openai.com/codex/hooks"

