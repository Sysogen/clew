# The surfaces clew recognises.
#
# Rows, not code. A tool renaming a path is a one-line change here, reviewable
# by anyone, with a citation and a date. Order matters: the first matching row
# wins, so a specific pattern must precede a general one.
#
# glob          matched against the repository-relative path, forward slashes
# tool          which tool owns it
# format        json, toml, or markdown. Omitted means json.
# extract       what to read out of it. Omitted means inventory only: the file
#               is reported and never opened, which matters when it may be a
#               compiled binary
# kind          what it is, for display and for rules
# last_verified when this row was last checked against primary documentation
# source        the documentation it was checked against

version = 1

# --- Claude Code ------------------------------------------------------------

[[surface]]
glob = "**/.claude/settings.json"
tool = "claude-code"
kind = "claude-code"
extract = ["hooks", "permissions", "mcp-servers"]
last_verified = "2026-09-11"
source = "https://code.claude.com/docs/en/settings"

[[surface]]
glob = "**/.claude/settings.local.json"
tool = "claude-code"
kind = "claude-code"
extract = ["hooks", "permissions", "mcp-servers"]
last_verified = "2026-09-11"
source = "https://code.claude.com/docs/en/settings"

[[surface]]
glob = "**/.mcp.json"
tool = "claude-code"
kind = "mcp-servers"
extract = ["mcp-servers"]
last_verified = "2026-09-11"
source = "https://code.claude.com/docs/en/mcp"

[[surface]]
glob = "**/.claude/**/hooks/**"
tool = "claude-code"
kind = "hook-script"
last_verified = "2026-09-11"
source = "https://code.claude.com/docs/en/hooks"

[[surface]]
glob = "**/.claude/skills/**/SKILL.md"
tool = "claude-code"
kind = "skill"
format = "markdown"
extract = ["permissions"]
last_verified = "2026-09-11"
source = "https://code.claude.com/docs/en/skills"

[[surface]]
glob = "**/CLAUDE.md"
tool = "claude-code"
kind = "instruction"
last_verified = "2026-09-11"
source = "https://code.claude.com/docs/en/memory"

# --- Codex ------------------------------------------------------------------

[[surface]]
glob = "**/.codex/config.toml"
tool = "codex"
kind = "codex"
format = "toml"
extract = ["mcp-servers"]
last_verified = "2026-09-11"
source = "https://github.com/openai/codex/blob/main/docs/config.md"

[[surface]]
glob = "**/AGENTS.md"
tool = "codex"
kind = "instruction"
last_verified = "2026-09-11"
source = "https://agents.md"

# --- Cursor -----------------------------------------------------------------

[[surface]]
glob = "**/.cursor/mcp.json"
tool = "cursor"
kind = "cursor"
extract = ["mcp-servers"]
last_verified = "2026-09-11"
source = "https://docs.cursor.com/context/model-context-protocol"

[[surface]]
glob = "**/.cursorrules"
tool = "cursor"
kind = "cursor"
last_verified = "2026-09-11"
source = "https://docs.cursor.com/context/rules"

# --- VS Code and Copilot ----------------------------------------------------

[[surface]]
glob = "**/.vscode/mcp.json"
tool = "vscode"
kind = "vscode"
last_verified = "2026-09-11"
source = "https://code.visualstudio.com/docs/copilot/chat/mcp-servers"
# extract: the server key here is not `mcpServers`; shape unverified

[[surface]]
glob = "**/.github/copilot-instructions.md"
tool = "copilot"
kind = "copilot"
last_verified = "2026-09-11"
source = "https://docs.github.com/copilot/customizing-copilot"

