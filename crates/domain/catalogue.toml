# --- Crush ------------------------------------------------------------------
#
# Crush merges everything it finds, project over global, `crushrc` over JSON in
# the same directory. Both forms are trusted code by its own documentation:
# they run with the user's shell privileges before the UI appears. So `crushrc`
# is read as the Bash it is and carries a hook script's checks, while the JSON
# form is parsed.
#
# A `crushrc` declares by calling builtins, so it is read twice: as the shell
# it is, and for what `hook add`, `permissions allow` and `mcp add` declare,
# which Crush's own loader files under the same keys its JSON form holds. A
# name a scan cannot know, as in `permissions allow $(cat list)`, is left out
# rather than reported under a name nothing is called; a command string is kept
# as written, since `curl $URL | sh` is worth reporting either way.

[[surface]]
glob = "**/{.crushrc,crushrc}"
tool = "crush"
kind = "crush"
format = "crushrc"
extract = ["hooks", "permissions", "mcp-servers"]
check = [
  "unrestricted-shell",
  "plaintext-transport",
  "invisible-unicode",
  "opaque-hook",
  "download-and-execute",
  "decode-and-execute",
  "credential-exfiltration",
  "unverified-download",
  "unpinned-remote-package",
]
last_verified = "2026-10-11"
source = "https://github.com/charmbracelet/crush/blob/main/docs/config/README.md"

# The deprecated JSON form, still discovered and still merged. Its hooks put
# the command on the entry itself rather than under an inner `hooks` array, its
# grants are `permissions.allowed_tools`, and its servers are under `mcp`.
# There is no autonomy row to read: `permissions` admits `allowed_tools` alone,
# and the flag that waives every prompt is passed on the command line, which no
# file records.
[[surface]]
glob = "**/{.crush.json,crush.json}"
tool = "crush"
kind = "crush"
format = "jsonc"
extract = ["hooks", "permissions", "mcp-servers"]
check = ["unrestricted-shell", "plaintext-transport"]
last_verified = "2026-10-11"
source = "https://github.com/charmbracelet/crush/blob/main/docs/hooks/README.md"

