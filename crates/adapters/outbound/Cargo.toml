[package]
name = "clew-adapter-fs"
description = "Outbound filesystem adapter for clew, implementing the FileTree port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clew-domain.workspace = true

# Solely for O_NOFOLLOW, so a symbolic link is refused in the open itself
# rather than by a check the open can race. std exposes no portable
# equivalent, and libc is the canonical source for the constant.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
