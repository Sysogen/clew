---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    # edited and labeled so retitling a pull request, or applying the
    # override label, re-runs the checks rather than leaving a stale red X.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Toolchain
        # rustup reads rust-toolchain.toml and installs the pinned channel and
        # its components, so the version here matches the one developers use.
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Package
        run: cargo package --allow-dirty

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build at the declared minimum
        # rust-version is a promise to consumers. Verify the workspace really
        # does build on it rather than trusting the number in the manifest.
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["rust_version"])')"
          echo "Declared MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" check --workspace --all-targets

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    # A maintainer can switch this off for one pull request by applying the
    # label. Nothing here is a correctness gate, so a human decision beats it.
    if: "!contains(github.event.pull_request.labels.*.name, 'override: commit-convention')"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Pull request title
        # Pull requests are squash merged, so the title becomes the subject of
        # the single commit that lands on main. That is the message worth
        # gating, and a maintainer can fix it by editing the title.
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-commit-message.sh --subject "$TITLE"

      - name: Contributor commits (advisory)
        # Individual commits never reach main through a squash merge, so this
        # reports without blocking. A contributor should not have to rewrite
        # history to get a fix reviewed.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-commit-message.sh --range "$PR_BASE..$PR_HEAD"

      - name: Commits pushed to main
        # These are the maintainer's own and are held to the full standard.
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          empty=0000000000000000000000000000000000000000
          if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$empty" ]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="HEAD"
          fi
          ./scripts/check-commit-message.sh --range "$range"
