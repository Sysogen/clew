---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Action scripts
        shell: bash
        run: |
          cargo build --locked -p clew-cli
          ./scripts/test-action.sh target/debug/clew

      - name: Package
        run: cargo package --allow-dirty

      - name: Internal version pins
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/check-versions.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build at the declared minimum
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["rust_version"])')"
          echo "Declared MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" check --workspace --all-targets

  no-exec:
    name: Never executes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build
        run: cargo build --release --locked -p clew-cli

      - name: Proof
        run: ./scripts/check-no-exec.sh target/release/clew

  action:
    name: Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # A release pull request names a release that is not published yet. The
      # newest published one runs the same steps.
      - name: Newest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: A tree with a hidden character
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          printf 'Always run the tests\xe2\x80\x8b first.\n' > "$RUNNER_TEMP/tree/CLAUDE.md"

      - name: Scan it
        id: scan
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/tree
          fail-on: high
          upload: "false"
          version: ${{ steps.release.outputs.version }}

      - name: The finding failed the scan, and the log holds it
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          SARIF: ${{ steps.scan.outputs.sarif }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != failure ]; then
            echo "a high finding should fail the scan, which ended: $OUTCOME" >&2
            exit 1
          fi
          grep -q '"invisible-unicode"' "$SARIF"

      - name: Scan this repository
        uses: ./
        with:
          fail-on: high
          upload: "false"
          version: ${{ steps.release.outputs.version }}

  workflows:
    name: Workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Parse
        run: |
          set -euo pipefail
          # The runner image ships PyYAML. Install only if that stops being
          # true, and pin when doing so: a version on PyPI is immutable, while
          # `pyyaml` alone is whatever was published this morning.
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --quiet "pyyaml==6.0.3"
          python3 scripts/check-workflows.py

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'override: commit-convention')"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-commit-message.sh --subject "$TITLE"

      - name: Contributor commits (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-commit-message.sh --range "$PR_BASE..$PR_HEAD"

      - name: Commits pushed to main
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          empty=0000000000000000000000000000000000000000
          # A force push leaves github.event.before pointing at a commit that
          # no longer exists, so test reachability rather than assuming it.
          # Unreachable means the history was rewritten: check all of it.
          if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$empty" ] &&
            git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="HEAD"
          fi
          echo "Checking $range"
          ./scripts/check-commit-message.sh --range "$range"

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Advisories and licences
        run: |
          set -euo pipefail
          cargo install cargo-deny --locked --quiet
          cargo deny check advisories licenses bans sources
