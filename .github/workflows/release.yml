---
name: Release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Tag matches the manifest
        id: check
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match version $version in Cargo.toml" >&2
            exit 1
          fi

      - name: Tag is on main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$TAG" origin/main \
            || { echo "$TAG is not an ancestor of main" >&2; exit 1; }

      - name: Internal version pins
        run: ./scripts/check-versions.sh

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          conclusions="$(gh run list --commit "$sha" --workflow CI \
            --json conclusion --jq '.[].conclusion')"
          if [ -z "$conclusions" ]; then
            echo "no CI run found for $sha; release only from a commit CI has checked" >&2
            exit 1
          fi
          if grep -qv '^success$' <<<"$conclusions"; then
            echo "CI did not succeed on $sha:" >&2
            echo "$conclusions" >&2
            exit 1
          fi
          echo "CI succeeded on $sha"

  publish:
    name: crates.io
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.TAG }}

      - name: Dry run
        run: cargo publish --workspace --dry-run

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --no-verify

  binaries:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" \
            >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p clew-cli

      - name: Never executes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./scripts/check-no-exec.sh
          else
            ./scripts/check-no-exec.sh "target/${{ matrix.target }}/release/clew"
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="clew-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/clew.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/clew" "dist/$name/"
          fi
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # Git Bash on the Windows runner has sha256sum but not shasum, which
          # is a perl script. Every runner has one of the two.
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --title "clew $TAG" \
            --notes "See [CHANGELOG.md](CHANGELOG.md)." \
            --verify-tag
