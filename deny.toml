[advisories]
yanked = "deny"

[licenses]
# Zlib carries no copyleft and no binary attribution clause, so it
# redistributes under Apache-2.0. It reaches us through foldhash, the default
# hasher behind yaml-rust2.
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
# rustls only. openssl is a C dependency with a worse history.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "duct" },
    { name = "subprocess" },
    { name = "xshell" },
    { name = "command-group" },
    { name = "async-process" },
    { name = "shell-words" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
